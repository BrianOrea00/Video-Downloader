name: CI

on:
  push:
    branches: [main, InProgress]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Qt's offscreen platform still needs these at load time; without them
      # the GUI smoke test fails on a bare runner.
      - name: Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libglib2.0-0 libxkbcommon-x11-0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Tests (including the offscreen GUI smoke test)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t . -v
